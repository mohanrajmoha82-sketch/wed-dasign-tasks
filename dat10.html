<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>day10</title>
    <style>
        .circle1 {
            width: 100px;
            height: 130px;
            border-radius: 50%;
            background-color: blue;
            animation-name: c1;
            animation-duration: 2s;
            position: absolute;
        }

        .circle2 {
            width: 100px;
            height: 130px;
            border-radius: 50%;
            background-color: blue;
            margin-top: 150px;
            animation-name: c2;
            animation-duration: 2s;
            animation-iteration-count: 2;
            position: absolute;

        }

        .circle3 {
            width: 100px;
            height: 130px;
            border-radius: 50%;
            margin-left: 200px;
            background: #000;


        }

        @keyframes c1 {
            form {
                background-color: brown;
            }

            to {
                background-color: antiquewhite;
            }
        }

        @keyframes c2 {
            0% {
                background-color: rgb(216, 27, 27);
                top: 0;
                left: 0;
            }

            25% {
                background-color: rgb(138, 138, 228);
                top: 120px;
                left: 0;
            }

            50% {
                background-color: rgb(129, 125, 119);
                top: 120px;
                left: 120px;
            }

            75% {
                background-color: rgb(199, 243, 155);
                top: 0;
                left: 120px;
            }

            100% {
                background-color: blue;
                top: 0;
                left: 0;
            }
        }

        .circle3:hover {
            width: 120px;
            height: 150px;
            /* transition: 2s; */
            /* transition-delay: 1s; */
            transition-duration: 2s;
        }

        .box {
            height: 50px;
            width: 100%;
            background-color: black;
            color: white;
            font-size: 20px;
            margin-top: 300px;
        }

        .box ul {
            display: flex;
            justify-content: space-around;

        }

        .box ul li {
            list-style-type: none;
            padding-top: 15px;
        }

        .box ul li ul {
            display: none;
        }

        .box ul li:hover>ul {
            display: block;
            height: 120px;
            width: 100px;
            background: #000;
        }
    </style>
</head>

<body>
    <!-- 1.animation -->
    <div>
        <div class="circle1"></div>
    </div>
    <div>
        <div class="circle2"></div>
    </div>
    <!--2.transition -->
    <div>
        <div class="circle3"></div>
    </div>
    <div class="box">
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Product
                <ul>
                    <li>Mobile</li>
                    <li>Laptop</li>
                    <li>PC</li>
                </ul>
            </li>
            <li>Order</li>
            <li>Contact</li>
        </ul>
    </div>
</body>

</html>
