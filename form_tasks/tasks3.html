<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tasks3(Form Brlow)</title>
</head>
<body>
    <table border="1" style="border-color: black;">
        <form>
            <tr>
                <th colspan="2">Full the form below</th>
            </tr>
            <tr>
                <td>Name</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password"></td>
            </tr>
            <tr>
                <td>Feedback</td>
                <td><textarea style="width: 170px; height: 50px;"></textarea></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" value="1" name="0">Male
                    <input type="radio" value="1" name="0">Female
                </td>
            </tr>
            <tr>
                <td>Subject</td>
                <td>
                    <input type="checkbox">Web
                    <input type="checkbox">Math
                    <input type="checkbox">Graphics
                    <input type="checkbox">English
                </td>
            </tr>
            <tr>
                <td></td>
                <td align="center">
                    <button type="reset">Reset All</button>
                    <button type="submit">Submit Above Details</button>
                </td>
            </tr>
        </form>
    </table>
</body>
</html>
