<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tasks2(Registration Form)</title>
</head>
<body>
     <table cellpadding="10" cellspacing="0" style="background-color:rgb(224, 207, 185)" >
        <form>
            <tr>
                <th colspan="2"><u>Registration Form</u></th>
            </tr>
            <tr>
                <td>First Name</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Last Name</td>
                <td><input type="text" ></td>
            </tr>
            <tr>
                <td>Nick Name</td>
                <td><input type="text" ></td>
            </tr>
            <tr>
                <td>E-mail</td>
                <td><input type="email"></td>
            </tr>
            <tr>
                <td>PassWord</td>
                <td><input type="password"></td>
            </tr>
            <tr>
                <td>Date of Birth</td>
                <td><input type="date"></td>
            </tr>
            <tr>
                <td> Gender</td>
                <td style="font-size: 12px;">
                    <input type="radio" value="1" name="0">Male
                    <input type="radio" value="1" name="0">Female
                    <input type="radio" value="1" name="0">Others
                </td>
            </tr>
            <tr>
                <td>Mobile</td>
                <td><input type="tel"></td>
            </tr>
            <tr>
                <td>Address</td>
                <td>
                    <textarea style="width: 170px;"></textarea>
                </td>
            </tr>
            <tr align="center">
                <td colspan="2"> 
                    <input type="reset"> 
                    <input type="submit">
                </td>
            </tr>
        </form>
     </table>
</body>
</html>
