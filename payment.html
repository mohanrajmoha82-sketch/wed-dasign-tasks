<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital</title>
    <link rel="icon" href="images/website_icon.jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="digital.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <section>
        <div class="order_section">
            <hr class="address_line1">
            <hr class="address_line2">
            <a id="active" href="add_oreder.html">1</a>
            <a id="active" href="bill.html">2</a>
            <a class="oreder_step" id="active" href="">₹</a>
        </div>
    </section>
    <section>
        <div class="Pay">
            <h1>Paymeny Method</h1>
            <details class="Cash_on_Delivery">
                <summary>Cash on Delivery</summary>
                <p></p>
                <button><a href="oreder_comfirm.html">Place Order</a></button>
            </details>
            <details>
                <summary>UPI</summary>
                <ul>
                    <li>
                        Paytm <br>
                        <button><a href="oreder_comfirm.html">₹Pay</a></button>
                    </li>
                    <li>
                        Google Pay <br>
                        <button><a href="oreder_comfirm.html">₹Pay</a></button>
                    </li>
                    <li>
                        Phonepe <br>
                        <button><a href="oreder_comfirm.html">₹Pay</a></button>
                    </li>
                    <li>
                        Amazon Pay <br>
                        <button><a href="oreder_comfirm.html">₹Pay</a></button>
                    </li>
                </ul>
            </details>
            <details class="Credit">
                <summary>Credit / Debit / ATM Card</summary>
                <form>
                    <table>
                        <tr>
                            <td colspan="2">Card Number</td>
                        </tr>
                        <tr>
                            <td colspan="2"><input type="text" placeholder="xxxx xxxx xxxx xxxx "></td>
                        </tr>
                        <tr>
                            <th>Valid Thru</th>
                            <th>CVV</th>
                        </tr>
                        <tr>
                            <td><input type="text" placeholder="MM / YY"></td>
                            <td><input type="text" placeholder="CVV"></td>
                        </tr>
                        <tr>
                            <td colspan="2"><button><a href="">Pay</a></button></td>
                        </tr>
                    </table>
                </form>
            </details>
        </div>
    </section>
    <section class="oder_bill">
        <details>
            <summary>Price Details</summary>
            <p>Product Price <span>+ ₹1,00,222</span></p>
            <p>Total Discounts <span>+₹222</span></p>
            <hr>
            <p>Order Total <span>₹1,00,000</span></p>
        </details>
    </section>
</body>

</html>
