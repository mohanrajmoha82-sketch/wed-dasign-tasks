<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .link a:link{
            color: yellow;
        }
        .hover a:hover{
            color: brown;
        }
        .visited a:visited{
            color: cadetblue;
        } 
        .inline div{
            display:inline;
            background-color: blue;
        }
        .inline-block{
            display: inline-block;
            width: 100px;
            height: 300px;
         }
        .flex{
            display: flex;
            justify-content: space-around;
        }
         .grid{
            display: grid;
            grid-template-columns: auto auto auto;
         }
        .nav{
            display:flex;
            list-style-type: none;
            justify-content: space-between;
           
        }
        .nav li{
            background-color: black;
            width: 100px;
            height:25px ;
            text-align: center;
            border-radius: 20px;
            padding-top: 5px;
        }
        .nav a{
            color: wheat;
            text-decoration: none;
        }
        .nav li:hover{
            color: #000;
            width: 150px;
            height: 25px;
        }

    </style>
</head>
<body>
